[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "naudisha"
version = "0.1.0"
description = "NauDisha — Dynamic & Optimal Ship Routing System (SIH Project)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "NauDisha Team" }
]
keywords = ["maritime", "routing", "ship-routing", "d-star-lite", "cost-model", "navigation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "pydantic>=2.0.0",
    # Imported unconditionally by naudisha.api.main; without it nothing starts
    # and the whole test suite fails at collection.
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
    # tests/test_copernicus_provider.py and test_copernicus_batch_provider.py
    # build DataFrames directly.
    "pandas>=2.0.0",
    "websockets>=12.0",
]
marine = [
    "copernicusmarine>=2.0.0",
]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "httpx>=0.24.0",
    # uvicorn negotiates WebSocket support at startup. Without this the
    # /ws/ships/{imo} endpoint answers 404 even though the route is registered.
    "websockets>=12.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["naudisha*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
