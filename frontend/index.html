<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="NauDisha — dynamic and optimal maritime route planning using live oceanographic and atmospheric forecasts."
    />
    <title>NauDisha — Dynamic Ship Routing</title>

    <script>
      // Applies the stored theme before first paint so the page never flashes
      // the wrong colour scheme. ThemeProvider takes over after hydration.
      (function () {
        try {
          var stored = localStorage.getItem('naudisha.theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var dark = stored === 'dark' || ((stored === 'system' || !stored) && prefersDark)
          if (dark) document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {
          /* localStorage unavailable — fall through to the light default. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
